[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Sujit-Tokenizer"
version = "1.0.0"
description = "Custom Byte-Level BPE Tokenizer built from scratch in Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

authors = [
{name = "Sujit Shibaprasad Maity", email = "sujitmaity.in@gmail.com"}, {name = "Praveen Kumar Kannan", email = "Praveenkumar.kannan@gmail.com"}
]

keywords = [
"tokenizer",
"bpe",
"byte-pair-encoding",
"nlp",
"llm",
"machine-learning",
"artificial-intelligence"
]

classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"Intended Audience :: Education",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.9",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Topic :: Scientific/Engineering :: Artificial Intelligence",
"Topic :: Text Processing"
]

dependencies = []

[project.urls]
Homepage = "https://github.com/iamsspm07/Sujit-Tokenizer"
Repository = "https://github.com/iamsspm07/Sujit-Tokenizer"
Issues = "https://github.com/iamsspm07/Sujit-Tokenizer/issues"
